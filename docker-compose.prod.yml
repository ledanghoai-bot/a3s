# docker-compose.prod.yml — cau hinh PRODUCTION day du, doc lap (issue #9, Bat 1)
#
# Chay bang: docker compose -f docker-compose.prod.yml up -d --build
# (KHONG ket hop voi docker-compose.yml — day la file DOC LAP, day du, tranh
# rui ro tuong thich voi co che merge/override cua cac ban Docker Compose cu
# hon chua ho tro tot viec "xoa" gia tri list tu file base, vd volumes/ports).
#
# Khac gi so voi docker-compose.yml (dev):
# - api/worker/telegram_bot/telegram_customer_bot: KHONG bind-mount source
#   code (`.:/srv`) — code duoc build THANG vao image luc build, khong the
#   sua file "song" nhu dev nua (dung y, production khong nen cho phep sua
#   code ma khong qua deploy chinh thuc).
# - dashboard: PRODUCTION BUILD (`npm run build && npm start`) thay vi
#   dev-mode hot-reload — nhanh hon, on dinh hon, dung dung muc dich.
# - db/redis: KHONG expose port ra ngoai host (5432/6379) — chi cac service
#   trong CUNG docker network moi truy cap duoc, giam be mat tan cong.
# - Tat ca service co `restart: unless-stopped` — tu khoi dong lai neu crash
#   hoac VPS reboot.
#
# CHUA co trong file nay (se lam o Bat sau cua issue #9):
# - Backup PostgreSQL tu dong.
# - Alert/monitoring.
#
# Reverse proxy + HTTPS: service `caddy` ben duoi (them khi da co VPS + domain
# that). Yeu cau .env tren VPS co DOMAIN va DASH_DOMAIN (khong co gia tri mac
# dinh — thieu la caddy khong route duoc). api/dashboard chi bind 127.0.0.1
# tren host: Docker publish port di tat qua iptables nen ufw KHONG chan duoc,
# bind loopback la cach duy nhat dam bao ngoai chi vao duoc qua Caddy (HTTPS).
#
# LUU Y QUAN TRONG: sau khi sua code (bat ky file .py/.js nao), PHAI chay lai
# `docker compose -f docker-compose.prod.yml up -d --build <service>` —
# KHONG co hot-reload trong file nay (dung y, production ben vung hon dev).

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - m4_signing_socket:/run/m4-signing
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # I-B M4 Stage 0P (A08-COR-01/F-A08-R1-01): tien trinh signing service THAT, tach biet hoan
  # toan khoi api/worker (2 UID he dieu hanh khac nhau, xem Dockerfile). Day la topology duoc
  # supervise/version-control (thay the launcher tu spawn process bang asyncio truoc day) --
  # docker compose la supervisor that: quan ly lifecycle/log/restart, khong con GC warning hay
  # pidfile tu viet tay.
  #
  # KHONG bao gio khoi dong boi `docker compose up -d` thuong — nam trong profile `m4-signing`
  # rieng, chi chay khi operator CHU DONG goi voi `--profile m4-signing`, dung yeu cau "dormant
  # deploy khong tu bat capture/service". Xem docs/M4-STAGE0P-SIGNING-SERVICE-RUNBOOK-VI.md cho
  # chu ky start/probe/stop day du.
  #
  # `restart: "no"` LA CO Y (khong phai thieu sot): day la tien trinh giu khoa ky nhay cam
  # trong bo nho gan voi 1 ceremony rehearsal cu the — auto-restart sau crash co the tai khoi
  # dong voi trang thai khong ro rang hoac am tham che giau 1 crash-loop dang bi khai thac.
  # Operator PHAI tu quyet dinh restart tuong minh (`docker compose --profile m4-signing up -d
  # m4-signer` lai, voi cung 3 khoa da dua cho `provision-keys`).
  # F-A08-R2-01 (dap PHASE1B-M4-AMENDMENT-08-SIGNING-CLEANUP-CORRECTION-REVIEW-2-VI.md): REV1 dua
  # 3 khoa THAT vao `environment:` ($:?...} interpolation) - `docker inspect m4-signer` hien duoc
  # gia tri o Config.Env. REV2 nay CHI con truyen DUONG DAN FILE (`..._FILE`, khong phai gia tri
  # THAT) qua environment - 3 khoa THAT nam trong 1 bind-mount READ-ONLY tu 1 thu muc host operator
  # tu chuan bi (chown dung UID 5001/GID 5000 - CUNG UID/GID Dockerfile tao co dinh - + chmod 0400/
  # 0440, xem runbook §3) - `docker inspect` se KHONG con hien gia tri o bat ky truong nao (chi
  # hien DUONG DAN mount, khong phai secret). `stage0p_signing_service.py` (_read_secret_env_or_file)
  # TU KIEM TRA LAI quyen file doc lap luc khoi dong (khong chi tin bind-mount host giu dung
  # permission), tu choi khoi dong neu file co bat ky bit group/other nao hoac sai chu so huu.
  # I-B M4 socket-volume init (dap PHASE1B-M4-AMENDMENT-11-EXECUTION-ATTEMPT-1-ABORT-REVIEW-VI.md):
  # named volume `m4_signing_socket` duoc Docker tao mac dinh `root:root 0755`, trong khi m4-signer
  # chay UID 5001 -- `_validate_socket_directory()` (stage0p_signing_service.py) TU CHOI KHOI DONG
  # (fail-closed dung thiet ke) vi thu muc socket khong thuoc so huu tien trinh. Day la thieu sot
  # provisioning topology: TRUOC correction nay khong co buoc nao (compose hay runbook) khoi tao
  # owner/mode cho volume do -- Amendment 11 Attempt 1 abort chinh vi vay.
  #
  # Service init NGAN HAN nay chay MOT LAN, ngay truoc m4-signer (qua `depends_on` voi dieu kien
  # `service_completed_successfully`), CHI mount dung volume socket (KHONG mount thu muc secret,
  # KHONG cham DB/Redis), dat `5001:5000` + `0710`, TU XAC MINH lai bang `stat` roi thoat 0. Neu
  # xac minh that bai -> exit 1 -> Compose KHONG start m4-signer (fail-closed o ca lop nay).
  #
  # Vi sao `0710`: owner (5001=m4-signer) `rwx` de tao/quan ly socket; group (5000=m4-signing-ipc)
  # CHI `--x` -- m4-collector (UID 5002, cung group) di qua duoc thu muc de mo socket theo dung
  # duong dan da biet, nhung KHONG liet ke duoc noi dung; other KHONG co bit nao. Khop chinh xac
  # yeu cau `_validate_socket_directory(shared_gid=5000)`.
  #
  # Day la thao tac privileged DUY NHAT va HEP NHAT co the: chay `user: "0:0"` (can root de chown)
  # nhung chi trong 1 container ngan han, chi thay doi 1 volume, version-controlled va review duoc
  # -- thay vi bat operator tu tim Docker host mountpoint roi `chown` tay tren production.
  m4-signer-init:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    profiles: ["m4-signing"]
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -eu
        chown 5001:5000 /run/m4-signing
        chmod 0710 /run/m4-signing
        uid=$$(stat -c %u /run/m4-signing)
        gid=$$(stat -c %g /run/m4-signing)
        mode=$$(stat -c %a /run/m4-signing)
        echo "m4-signer-init: /run/m4-signing uid=$$uid gid=$$gid mode=$$mode"
        if [ "$$uid" != "5001" ] || [ "$$gid" != "5000" ] || [ "$$mode" != "710" ]; then
          echo "m4-signer-init: FAIL - expected uid=5001 gid=5000 mode=710" >&2
          exit 1
        fi
        echo "m4-signer-init: OK"
    volumes:
      - m4_signing_socket:/run/m4-signing
    restart: "no"

  m4-signer:
    # I-B M4 image-freshness correction: GIT_COMMIT build-arg (dap
    # PHASE1B-M4-AMENDMENT-10-EXECUTION-ATTEMPT-1-ABORT-REVIEW-VI.md) - service nay khong nam trong
    # deploy.sh SERVICES nen khong tu rebuild moi lan deploy thuong; operator PHAI tu build tuong
    # minh truoc MOI lan `up -d` (xem docs/M4-STAGE0P-SIGNING-SERVICE-RUNBOOK-VI.md §2/§3) va xac
    # minh label `git_commit` khop `git rev-parse HEAD` truoc khi tiep tuc - khong tin cache image cu.
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    profiles: ["m4-signing"]
    command: python -m app.services.pii.stage0p_signing_service
    user: "5001:5000"
    environment:
      - STAGE0P_SIGNING_SOCKET=/run/m4-signing/signing.sock
      - STAGE0P_SIGNING_ALLOWED_UID=5002
      - STAGE0P_SIGNING_SHARED_GID=5000
      - REDIS_URL=redis://redis:6379/0
      - M4_SAMPLE_KEY_B64_FILE=/run/m4-signing-secrets/sample_key
      - M4_TRANSCRIPT_HMAC_KEY_B64_FILE=/run/m4-signing-secrets/transcript_hmac_key
      - M4_SIGNING_AUTH_VERIFY_KEY_B64_FILE=/run/m4-signing-secrets/signing_auth_key
    volumes:
      - m4_signing_socket:/run/m4-signing
      - /run/m4-signing-secrets:/run/m4-signing-secrets:ro
    depends_on:
      redis:
        condition: service_started
      # Socket-volume init PHAI hoan tat THANH CONG truoc khi signer start (dap
      # PHASE1B-M4-AMENDMENT-11-EXECUTION-ATTEMPT-1-ABORT-REVIEW-VI.md). `service_completed_successfully`
      # nghia la: init exit 0 -> signer start; init exit khac 0 (vd `stat` xac minh khong khop) ->
      # Compose KHONG start signer. Khong con phu thuoc thao tac tay cua operator tren host.
      m4-signer-init:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      # Chi kiem tra socket file TON TAI dung mode (lop song lop) - KHONG phai canary ky that
      # (F-A08-R1-03 canary that phai chay TU phia collector, xem
      # `scripts/m4_stage0p_signing_probe.py` va runbook §4) - self-check tu trong signer
      # KHONG chung minh duoc gi ve peer-UID path vi no khong PHAI collector.
      test: ["CMD", "test", "-S", "/run/m4-signing/signing.sock"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build: .
    command: arq app.workers.tasks.WorkerSettings
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  telegram_bot:
    build: .
    command: python -m app.workers.telegram_listener
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  telegram_customer_bot:
    build: .
    command: python -m app.workers.telegram_customer_listener
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    command: sh -c "npm ci && npm run build && npm start -- -p 3000 -H 0.0.0.0"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Phai dat DOMAIN trong .env (domain tro ve VPS, cho webhook/API)}
      DASH_DOMAIN: ${DASH_DOMAIN:?Phai dat DASH_DOMAIN trong .env (domain dashboard)}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alpha3s
      # QUAN TRONG: KHONG dung mat khau mac dinh yeu "alpha3s" nhu ban dev khi
      # deploy that - dat POSTGRES_PASSWORD that trong .env cua VPS (khac hoan
      # toan voi may dev), va cap nhat DATABASE_URL trong .env cho khop.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Phai dat POSTGRES_PASSWORD trong .env khi deploy production, khong dung mac dinh}
      POSTGRES_DB: alpha3s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  m4_signing_socket:
