# docker-compose.prod.yml — cau hinh PRODUCTION day du, doc lap (issue #9, Bat 1)
#
# Chay bang: docker compose -f docker-compose.prod.yml up -d --build
# (KHONG ket hop voi docker-compose.yml — day la file DOC LAP, day du, tranh
# rui ro tuong thich voi co che merge/override cua cac ban Docker Compose cu
# hon chua ho tro tot viec "xoa" gia tri list tu file base, vd volumes/ports).
#
# Khac gi so voi docker-compose.yml (dev):
# - api/worker/telegram_bot/telegram_customer_bot: KHONG bind-mount source
#   code (`.:/srv`) — code duoc build THANG vao image luc build, khong the
#   sua file "song" nhu dev nua (dung y, production khong nen cho phep sua
#   code ma khong qua deploy chinh thuc).
# - dashboard: PRODUCTION BUILD (`npm run build && npm start`) thay vi
#   dev-mode hot-reload — nhanh hon, on dinh hon, dung dung muc dich.
# - db/redis: KHONG expose port ra ngoai host (5432/6379) — chi cac service
#   trong CUNG docker network moi truy cap duoc, giam be mat tan cong.
# - Tat ca service co `restart: unless-stopped` — tu khoi dong lai neu crash
#   hoac VPS reboot.
#
# CHUA co trong file nay (se lam o Bat sau cua issue #9):
# - Backup PostgreSQL tu dong.
# - Alert/monitoring.
#
# Reverse proxy + HTTPS: service `caddy` ben duoi (them khi da co VPS + domain
# that). Yeu cau .env tren VPS co DOMAIN va DASH_DOMAIN (khong co gia tri mac
# dinh — thieu la caddy khong route duoc). api/dashboard chi bind 127.0.0.1
# tren host: Docker publish port di tat qua iptables nen ufw KHONG chan duoc,
# bind loopback la cach duy nhat dam bao ngoai chi vao duoc qua Caddy (HTTPS).
#
# LUU Y QUAN TRONG: sau khi sua code (bat ky file .py/.js nao), PHAI chay lai
# `docker compose -f docker-compose.prod.yml up -d --build <service>` —
# KHONG co hot-reload trong file nay (dung y, production ben vung hon dev).

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - m4_signing_socket:/run/m4-signing
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # I-B M4 Stage 0P (A08-COR-01/F-A08-R1-01): tien trinh signing service THAT, tach biet hoan
  # toan khoi api/worker (2 UID he dieu hanh khac nhau, xem Dockerfile). Day la topology duoc
  # supervise/version-control (thay the launcher tu spawn process bang asyncio truoc day) --
  # docker compose la supervisor that: quan ly lifecycle/log/restart, khong con GC warning hay
  # pidfile tu viet tay.
  #
  # KHONG bao gio khoi dong boi `docker compose up -d` thuong — nam trong profile `m4-signing`
  # rieng, chi chay khi operator CHU DONG goi voi `--profile m4-signing`, dung yeu cau "dormant
  # deploy khong tu bat capture/service". Xem docs/M4-STAGE0P-SIGNING-SERVICE-RUNBOOK-VI.md cho
  # chu ky start/probe/stop day du.
  #
  # `restart: "no"` LA CO Y (khong phai thieu sot): day la tien trinh giu khoa ky nhay cam
  # trong bo nho gan voi 1 ceremony rehearsal cu the — auto-restart sau crash co the tai khoi
  # dong voi trang thai khong ro rang hoac am tham che giau 1 crash-loop dang bi khai thac.
  # Operator PHAI tu quyet dinh restart tuong minh (`docker compose --profile m4-signing up -d
  # m4-signer` lai, voi cung 3 khoa da dua cho `provision-keys`).
  m4-signer:
    build: .
    profiles: ["m4-signing"]
    command: python -m app.services.pii.stage0p_signing_service
    user: "5001:5000"
    environment:
      - STAGE0P_SIGNING_SOCKET=/run/m4-signing/signing.sock
      - STAGE0P_SIGNING_ALLOWED_UID=5002
      - STAGE0P_SIGNING_SHARED_GID=5000
      - REDIS_URL=redis://redis:6379/0
      - M4_SAMPLE_KEY_B64=${M4_SAMPLE_KEY_B64:?Phai dat M4_SAMPLE_KEY_B64 trong shell TRUOC khi 'up' service nay (xem runbook) - KHONG dat trong .env/file nao}
      - M4_TRANSCRIPT_HMAC_KEY_B64=${M4_TRANSCRIPT_HMAC_KEY_B64:?Phai dat M4_TRANSCRIPT_HMAC_KEY_B64 trong shell TRUOC khi 'up' service nay - KHONG dat trong .env/file nao}
      - M4_SIGNING_AUTH_VERIFY_KEY_B64=${M4_SIGNING_AUTH_VERIFY_KEY_B64:?Phai dat M4_SIGNING_AUTH_VERIFY_KEY_B64 trong shell TRUOC khi 'up' service nay - KHONG dat trong .env/file nao}
    volumes:
      - m4_signing_socket:/run/m4-signing
    depends_on:
      - redis
    restart: "no"
    healthcheck:
      # Chi kiem tra socket file TON TAI dung mode (lop song lop) - KHONG phai canary ky that
      # (F-A08-R1-03 canary that phai chay TU phia collector, xem
      # `scripts/m4_stage0p_signing_probe.py` va runbook §4) - self-check tu trong signer
      # KHONG chung minh duoc gi ve peer-UID path vi no khong PHAI collector.
      test: ["CMD", "test", "-S", "/run/m4-signing/signing.sock"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build: .
    command: arq app.workers.tasks.WorkerSettings
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  telegram_bot:
    build: .
    command: python -m app.workers.telegram_listener
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  telegram_customer_bot:
    build: .
    command: python -m app.workers.telegram_customer_listener
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    command: sh -c "npm ci && npm run build && npm start -- -p 3000 -H 0.0.0.0"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Phai dat DOMAIN trong .env (domain tro ve VPS, cho webhook/API)}
      DASH_DOMAIN: ${DASH_DOMAIN:?Phai dat DASH_DOMAIN trong .env (domain dashboard)}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alpha3s
      # QUAN TRONG: KHONG dung mat khau mac dinh yeu "alpha3s" nhu ban dev khi
      # deploy that - dat POSTGRES_PASSWORD that trong .env cua VPS (khac hoan
      # toan voi may dev), va cap nhat DATABASE_URL trong .env cho khop.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Phai dat POSTGRES_PASSWORD trong .env khi deploy production, khong dung mac dinh}
      POSTGRES_DB: alpha3s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  m4_signing_socket:
